<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Management | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
    <div class="logo"><div class="logo-mark">B</div> Bank Management <span style="font-weight:400;font-size:14px;opacity:.8">| Admin Panel</span></div>
    <div class="right">
        <span id="greeting"></span>
        <button class="icon-btn" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
</header>

<main class="main" style="max-width:1200px;margin:0 auto">
    <div class="grid-4" style="margin-bottom:20px">
        <div class="stat"><span class="muted"><i class="bi bi-people-fill"></i> Customers</span><div class="num" id="stCustomers">-</div></div>
        <div class="stat"><span class="muted"><i class="bi bi-bank"></i> Total deposits</span><div class="num" id="stDeposits">-</div></div>
        <div class="stat"><span class="muted"><i class="bi bi-arrow-left-right"></i> Transactions</span><div class="num" id="stTxns">-</div></div>
        <div class="stat"><span class="muted"><i class="bi bi-hourglass-split"></i> Pending loans</span><div class="num" id="stLoans">-</div></div>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="customers">Customers &amp; Accounts</div>
        <div class="tab" data-tab="loans">Loan Requests</div>
        <div class="tab" data-tab="transactions">All Transactions</div>
    </div>

    <div class="card"><div class="table-wrap" id="tabContent"></div></div>
</main>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
