# ---------- Server ----------
server.port=8080

# ---------- Database (H2: a small database stored in the ./data folder, nothing to install) ----------
spring.datasource.url=jdbc:h2:file:./data/bankdb;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Run src/main/resources/schema.sql at every start (tables use CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always

# Browse the database at http://localhost:8080/h2-console (JDBC URL above, user sa, empty password)
spring.h2.console.enabled=true

# ---------- Want MySQL instead? Comment the H2 lines above and use these ----------
# spring.datasource.url=jdbc:mysql://localhost:3306/bankdb?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
