# Hosting platforms (Render, Railway...) provide the port in the PORT variable
server.port=${PORT:8080}

# H2 database stored in a file, so data survives restarts
spring.datasource.url=jdbc:h2:file:./data/bankdb
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates/updates the tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Database browser is OFF by default (unsafe on a public site).
# Locally, start with H2_CONSOLE=true to use http://localhost:8080/h2-console
spring.h2.console.enabled=${H2_CONSOLE:false}
